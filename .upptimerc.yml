# Upptime (https://github.com/upptime/upptime), D-1122-17. Our own public pages only.
owner: Antnioo
repo: dataarcus-status
user-agent: dataarcus-status

sites:
  - name: Home (English)
    url: https://dataarcus.com/
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "DataArcus"
  - name: Home (Arabic)
    url: https://dataarcus.com/ar/
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "DataArcus"
  - name: DataArcus for Power BI (download page)
    url: https://dataarcus.com/power-bi-mcp/
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "DataArcus"
  - name: Power BI Theme Generator
    url: https://dataarcus.com/tools/power-bi-theme-generator.html
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "DataArcus"
  - name: DAX Calendar Table Generator
    url: https://dataarcus.com/tools/dax-calendar-table-generator.html
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "DataArcus"
  - name: Power BI Model Health Check
    url: https://dataarcus.com/tools/power-bi-model-health-check.html
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "DataArcus"

assignees:
  - Antnioo

skipDeleteIssues: true
skipTopicsUpdate: true

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"

status-website:
  baseUrl: /dataarcus-status
  name: DataArcus status
  introTitle: "DataArcus website status"
  introMessage: "Checks of the dataarcus.com pages every 5 minutes or so. DataArcus for Power BI runs on your own computer, so it has nothing online to check."
  navbar:
    - title: Status
      href: /dataarcus-status/
    - title: dataarcus.com
      href: https://dataarcus.com/
